name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # actions/checkout can expose the tag as a lightweight ref, so
          # %(contents) would return the commit message instead of the
          # annotated tag message.  Read the tag object itself.
          REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          TYPE="$(printf '%s' "${REF}" | jq -r '.object.type')"
          SHA="$(printf '%s' "${REF}" | jq -r '.object.sha')"
          if [ "${TYPE}" = "tag" ]; then
            NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.message')"
          else
            NOTES="$(git log -1 --format=%B "${SHA}")"
          fi
          if [ -z "${NOTES}" ]; then
            NOTES="GeoPulse ${VERSION}"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" -y
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${VERSION}" \
            --notes "${NOTES}" \
            --verify-tag
