name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<NOTES
          GeoPulse ${VERSION}

          New
          - Move the first or last part of a route into the adjacent trip. The moved part adopts the mode of that trip; visits in between are removed after a confirmation.
          - New GeoPulse app icon.

          Improved
          - Walking and running tracks use more detail points and a light smoothing pass.
          - GPS fixes with an accuracy worse than 150 m are skipped.
          - Routes carry one timestamp per point, so splitting is time-accurate.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
